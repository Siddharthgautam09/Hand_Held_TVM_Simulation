# Mosquitto MQTT Broker Configuration for HTVM Simulation

# General settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Security settings (disable for development)
allow_anonymous true

# Standard MQTT port
listener 1883

# WebSocket support for web clients
listener 1884
protocol websockets

# Additional listener for secure connections (optional)
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key

# Connection settings
max_connections 1000
max_inflight_messages 20
max_queued_messages 200

# Message size limits
message_size_limit 10240

# Client timeout
keepalive_interval 60

# QoS settings
max_queued_bytes 0
queue_qos0_messages false

# Bridge configuration (if connecting to external brokers)
# connection bridge-name
# address external-broker.com:1883
# topic pattern both 2 "" ""

# Security (enable for production)
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
